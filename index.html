<style>
#together-mobile{--paper:#fffbef;--ink:#553e32;--rust:#9c4531;--sage:#596b42;--line:#d8cbb7;color:var(--ink);font:15px/1.5 Georgia,serif;max-width:460px;margin:auto;background:var(--paper);border-radius:22px;border:1px solid var(--line);box-shadow:0 8px 30px #4c382515;overflow:hidden;color-scheme:light}#together-mobile *{box-sizing:border-box}#together-mobile button,#together-mobile input,#together-mobile select,#together-mobile textarea{font:inherit}#together-mobile button{cursor:pointer;color:inherit;min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fffdf5;padding:9px 13px}#together-mobile button:hover{background:#eeeeda}#together-mobile button:focus-visible,#together-mobile input:focus-visible,#together-mobile textarea:focus-visible,#together-mobile select:focus-visible{outline:3px solid #9c4531;outline-offset:2px}#together-mobile h1,#together-mobile h2,#together-mobile h3,#together-mobile p{margin:0}#together-mobile h1{font-size:30px;line-height:1.2;color:var(--rust)}#together-mobile h2{font-size:23px;line-height:1.3}#together-mobile h3{font-size:18px}#together-mobile .top{padding:22px 20px 17px;background:repeating-linear-gradient(90deg,transparent 0 3px,#8c704405 3px 4px)}#together-mobile .eyebrow{font:11px/1.4 Georgia,'Times New Roman',serif;letter-spacing:1.6px;text-transform:uppercase;margin-bottom:8px;color:#786954}#together-mobile .row{display:flex;gap:10px;align-items:center;justify-content:space-between}#together-mobile .sub{font:12px/1.5 Georgia,'Times New Roman',serif;color:#776957}#together-mobile .gingham{height:9px;background:repeating-linear-gradient(90deg,#d9998d65 0 8px,#fff8ec 8px 16px);border-block:1px dashed #bd8172}#together-mobile .content{padding:20px 16px}#together-mobile .primary{background:var(--sage);color:#fffdf3;border:1px dashed #fff9cf;outline:2px solid var(--sage);outline-offset:-4px}#together-mobile .primary:hover{background:#465b33}#together-mobile .full{width:100%;margin-top:15px}#together-mobile .month{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;margin:16px 0 12px}#together-mobile .month button{padding:6px}#together-mobile .calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}#together-mobile .weekday{text-align:center;font:11px/1.5 Georgia,'Times New Roman',serif;padding:6px 0;color:#776957}#together-mobile .day{padding:4px 0;height:51px;border:0;border-radius:10px;font:14px/1.3 Georgia,'Times New Roman',serif;position:relative;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}#together-mobile .day.shared{background:#e8eddb}#together-mobile .day.selected{outline:2px dashed var(--rust);outline-offset:-3px;background:#faeadd}#together-mobile .dots{display:flex;gap:3px;height:5px;align-items:center}#together-mobile .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}#together-mobile .legend{display:flex;gap:10px;flex-wrap:wrap;font:11px/1.5 Georgia,'Times New Roman',serif;margin:13px 0}#together-mobile .legend span{display:flex;align-items:center;gap:4px}#together-mobile .sheet{padding:16px;background:#fffef7;border:1px dashed #caba9e;border-radius:14px;margin-top:17px;position:relative}#together-mobile .person{display:flex;align-items:center;gap:9px;margin-top:11px;font:13px/1.4 Georgia,'Times New Roman',serif}#together-mobile .person .time{margin-left:auto}#together-mobile .person .dot{width:10px;height:10px}#together-mobile .overlap{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}#together-mobile .overlap button{background:#edf0df;border:1px solid #9ca97d;color:#40572e;font:13px/1.4 Georgia,'Times New Roman',serif;width:100%}#together-mobile .overlap button[aria-pressed=true]{background:var(--sage);color:#fff}#together-mobile .weather{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:14px}#together-mobile .weather button{padding:10px 3px;background:#fffdf5;display:grid;gap:3px;text-align:center;font:12px/1.5 Georgia,'Times New Roman',serif}#together-mobile .weather .active{border:2px dashed var(--rust);background:#fff0df}#together-mobile .weather .symbol{font-size:27px}#together-mobile .weather .temp{font-size:19px;font-family:Georgia,serif}#together-mobile .note{background:#fff0bd;padding:20px 16px 16px;margin-top:22px;position:relative;box-shadow:2px 3px 0 #d8c49a35;transform:rotate(-.4deg)}#together-mobile .note:before{content:'';position:absolute;top:-8px;left:35%;width:80px;height:17px;background:repeating-linear-gradient(90deg,#d9918266 0 6px,#f6d0bf99 6px 12px);transform:rotate(3deg)}#together-mobile .note p{margin:6px 0 12px}#together-mobile .note .actions{display:flex;gap:8px;flex-wrap:wrap}#together-mobile nav{display:grid;grid-template-columns:repeat(4,1fr);background:#f6f0e2;border-top:1px dashed #bcad93;padding:8px 6px;gap:4px}#together-mobile nav button{border:0;background:transparent;padding:5px 3px;border-radius:8px;font:11px/1.5 Georgia,'Times New Roman',serif;display:flex;align-items:center;flex-direction:column;gap:3px}#together-mobile nav button[aria-current=page]{background:#e4e9d6;color:#40572e}#together-mobile nav .navicon{font-size:20px;font-family:Georgia,serif}#together-mobile .stamp{text-align:center;padding:10px;font:10px/1.4 Georgia,'Times New Roman',serif;color:#776957;letter-spacing:.4px}#together-mobile label{display:block;font:13px/1.4 Georgia,'Times New Roman',serif;margin:12px 0 5px}#together-mobile input:not([type=checkbox]):not([type=color]),#together-mobile select,#together-mobile textarea{display:block;width:100%;min-width:0;padding:11px;background:#fffefa;border:1px solid #cabb9e;border-radius:9px;color:var(--ink);font:16px/1.4 Georgia,'Times New Roman',serif}#together-mobile input[type=color]{width:65px;height:44px;padding:3px;border:1px solid #cabb9e;background:#fffefa;border-radius:7px}#together-mobile .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}#together-mobile .check{display:flex;gap:10px;align-items:center;min-height:44px}#together-mobile .check input{width:20px;height:20px;accent-color:var(--sage)}#together-mobile .error{color:#9c3027;font:13px/1.5 Georgia,'Times New Roman',serif;margin-top:8px}#together-mobile .link{border:0;background:transparent;text-decoration:underline;padding:6px 2px;font:12px/1.4 Georgia,'Times New Roman',serif}#together-mobile .toast{padding:10px 15px;background:#e9eedc;font:13px/1.5 Georgia,'Times New Roman',serif;color:#40572e}#together-mobile .pinlist button{width:100%;text-align:left;display:flex;align-items:center;gap:9px;margin-top:8px;background:#fffdf5}#together-mobile .pinlist small{display:block;font:12px/1.4 Georgia,'Times New Roman',serif;color:#776957}#together-mobile .maparea{height:330px;position:relative;background:#eee9d8;border-radius:13px;overflow:hidden;border:1px solid #d4c8af;margin-top:15px;touch-action:none}#together-mobile .maptools{position:absolute;right:8px;top:8px;display:grid;gap:5px}#together-mobile .maptools button{padding:5px;width:44px;box-shadow:0 2px 4px #553e3210}#together-mobile .mapstatus{position:absolute;left:8px;bottom:8px;padding:4px 7px;background:#fffdf2e8;border-radius:5px;font:11px/1.4 Georgia,'Times New Roman',serif;pointer-events:none}#together-mobile .attr{font:10px/1.4 Georgia,'Times New Roman',serif;margin:5px 0;color:#776957}#together-mobile a{color:#7d4031}#together-mobile .saved{background:#f5eadb;padding:12px;border-radius:9px;font:13px/1.5 Georgia,'Times New Roman',serif;margin-top:12px}#together-mobile .tag{display:inline-block;background:#ebeeda;padding:3px 8px;border-radius:6px;font:11px/1.5 Georgia,'Times New Roman',serif;margin:6px 0}#together-mobile .swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#together-mobile .swatches button{width:44px;height:44px;border:3px solid #fffbef;outline:1px solid #cabb9e}#together-mobile [hidden]{display:none!important}
#together-mobile{--paper:#fcf5e3;--rust:#943e30;--line:#c8b797;border-radius:5px 16px 8px 13px;border:1px solid #d8c4a4;box-shadow:3px 5px 0 #c9b59033;background-color:var(--paper);background-image:repeating-linear-gradient(0deg,#a4916b09 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,#a4916b0b 0 1px,transparent 1px 4px)}
#together-mobile .top{padding:22px 18px 18px;border:1px dashed #b59b76;margin:7px 7px 0;background:transparent;position:relative}
#together-mobile h1{font-family:Georgia,'Times New Roman',serif;font-size:44px;font-weight:400;letter-spacing:.3px;text-shadow:1px 1px #f7d1b8;line-height:1}
#together-mobile h2{color:#843e2e;font-size:25px;font-weight:500}
#together-mobile h3{font-weight:500;color:#683e2b}
#together-mobile .sewn-heart{color:#a74c46;font-family:Georgia,'Times New Roman',serif}
#together-mobile .embroidery{white-space:pre;font:bold 9px/6px monospace;letter-spacing:1px;transform:rotate(5deg);display:block;flex-shrink:0;padding:0 4px}
#together-mobile .embroidery .petals{display:block;color:#b44c65;text-shadow:.5px .5px #e0b597}
#together-mobile .embroidery .stems{display:block;color:#617347;text-shadow:.5px .5px #d6c6a4}
#together-mobile .gingham{height:16px;margin:0 10px;background-color:#f7e8d5;background-image:repeating-linear-gradient(90deg,#b9685d3a 0 7px,transparent 7px 14px),repeating-linear-gradient(0deg,#b9685d3a 0 7px,transparent 7px 14px);border:0;transform:rotate(-.7deg)}
#together-mobile .content{padding:16px 17px 23px}
#together-mobile button{border-radius:3px 8px 4px 6px;border-color:#c2ac8d;background-color:#fffbef}
#together-mobile button.primary{background-color:var(--sage);border:1px dashed #ecedcf;outline:1px solid #e0e6c4;outline-offset:-5px;border-radius:4px 9px 4px 7px;box-shadow:2px 2px #a4976f25}
#together-mobile .content>button.primary:first-child{margin-top:0}
#together-mobile .month{margin:20px 0 10px}
#together-mobile .month h3{font-family:Georgia,'Times New Roman',serif;font-size:25px}
#together-mobile .calendar{gap:1px;padding:6px;background:#fffbee;border:1px dashed #baaa86;border-radius:2px;box-shadow:2px 3px #9b87621c}
#together-mobile .weekday{background:#788260;color:#fffdef;padding:7px 0}
#together-mobile .day{border-radius:0;border-bottom:1px dotted #d6c8aa;background:#fffbee;font-family:Georgia,serif;font-size:15px}
#together-mobile .day.shared{background:#e6ebd5}
#together-mobile .day.selected{border-radius:3px 7px 3px 8px;outline:1.5px dashed #a04434;background:#f8e5d7}
#together-mobile .event-dot{position:absolute;right:4px;top:1px;font-size:10px;color:#a04434}
#together-mobile .sheet{background-color:#fffbee;background-image:repeating-linear-gradient(0deg,transparent 0 27px,#b6a58c14 27px 28px);border:1px dashed #b8a887;border-radius:2px 5px 2px 7px;box-shadow:2px 3px 0 #ae987025;padding:20px 15px 16px;margin-top:22px}
#together-mobile .sheet:before{content:'';position:absolute;left:40%;top:-8px;width:65px;height:15px;opacity:.8;transform:rotate(-4deg);background-color:#f9e5cf;background-image:repeating-linear-gradient(90deg,#c8756740 0 6px,transparent 6px 12px),repeating-linear-gradient(0deg,#c8756740 0 6px,transparent 6px 12px);pointer-events:none}
#together-mobile .sheet h3{font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.2}
#together-mobile .weather button{border-radius:2px 6px 3px 7px;border:1px dashed #bdac88;box-shadow:1px 2px #ab95671a}
#together-mobile .weather button.active{border:2px dashed #9c4531;background:#ffebd8}
#together-mobile .weather .symbol{color:#98713c}
#together-mobile .note{background-color:#f8e6ac;background-image:repeating-linear-gradient(0deg,transparent 0 25px,#a88e5620 25px 26px);border-radius:3px 2px 7px 2px;border-bottom:3px double #d9bd79;transform:rotate(-.6deg);padding-top:23px}
#together-mobile .note h3{font-family:Georgia,'Times New Roman',serif;font-size:24px}
#together-mobile .note:before{background-image:repeating-linear-gradient(90deg,#c2776a55 0 6px,transparent 6px 12px),repeating-linear-gradient(0deg,#c2776a55 0 6px,transparent 6px 12px);background-color:#fbe1cd}
#together-mobile .eyebrow{letter-spacing:.4px;text-transform:none;font-family:Georgia,serif;font-style:italic;font-size:13px}
#together-mobile nav{background:#eae4d2;padding-top:12px;border-top:2px dashed #b59b76}
#together-mobile nav button{border-radius:4px 4px 0 0;background:#fff8e7;border:1px dashed #c5ae8c;font-family:Georgia,serif;font-size:12px}
#together-mobile nav button:nth-child(2){transform:rotate(1deg)}
#together-mobile nav button:nth-child(3){transform:rotate(-1deg)}
#together-mobile nav button[aria-current=page]{background:#65754d;color:#fffced;border-color:#d1daba}
#together-mobile .add-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 22px}
#together-mobile .section-label{font-family:Georgia,'Times New Roman',serif;font-size:23px;margin:24px 0 8px;border-bottom:1px dashed #b6a17f;padding-bottom:5px}
#together-mobile .event-card{display:grid;grid-template-columns:53px minmax(0,1fr);gap:12px;border-color:#b56f5d;background:#fff1da}
#together-mobile .event-date{border:1px dashed #aa6654;text-align:center;align-self:start;background:#fff9ec;transform:rotate(-3deg)}
#together-mobile .event-date span{display:block;background:#a35846;color:#fff5df;font:12px/1.7 Georgia,serif;text-transform:uppercase}
#together-mobile .event-date strong{font:32px/1.4 Georgia,'Times New Roman',serif;display:block;color:#824a38}
#together-mobile .event-actions{display:flex;gap:18px;flex-wrap:wrap;margin-top:5px}
#together-mobile .day-event{display:grid;gap:2px;background:#f6e4d0;border-left:2px solid #a35846;margin:12px 0;padding:8px 10px}
#together-mobile .idea-card:nth-of-type(even){transform:rotate(.4deg)}
#together-mobile .tag{background:#e4e8cd;border-radius:1px;font-family:Georgia,serif}
#together-mobile .maparea{border-radius:2px;border:5px solid #fffdf1;outline:1px dashed #baa17e;box-shadow:2px 3px #b8a17e33}
#together-mobile .stamp{font-size:10px;letter-spacing:1px}
@media(max-width:370px){#together-mobile .content{padding-inline:12px}#together-mobile h1{font-size:39px}#together-mobile .event-card{gap:9px;grid-template-columns:45px minmax(0,1fr)}#together-mobile .calendar{padding:3px}#together-mobile .dots{gap:2px}}

<script>window.HPLC_API="https://together-hangouts-k7m4.basiccamel256.chatgpt.site/api/calendar";</script><script>
(()=>{
const root=document.getElementById('together-mobile'),content=root.querySelector('#tg-content');
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Melbourne',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const initial={people:[],me:-1,month:Number(today.slice(5,7))-1,year:Number(today.slice(0,4)),date:today,tab:'calendar',selectedTime:null,entries:[],ideas:[],events:[],pins:[],voted:[],plan:null};
let s=structuredClone(initial),view='calendar',form=null,editPin=null,pendingLocation=null,addingPin=false,ideaIndex=0,editingEvent=null;
let token=localStorage.getItem('hplc-token');if(!token){token=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('hplc-token',token);}
let memberId=Number(localStorage.getItem('hplc-member')||0),serverState=null,syncing=false,loaded=false,forecast=null,weatherError=false,liveMap=null,mapCentre=[-37.8136,144.9631],mapLevel=13;
const API=window.HPLC_API||'/api/calendar';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateLabel=x=>new Date(x+'T12:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});const time=h=>h===24?'midnight':h===0?'midnight':`${h%12||12}${h<12?' am':' pm'}`;const range=(a,b)=>a===0&&b===24?'All day':`${time(a)}–${time(b)}`;const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const uid=()=>Math.random().toString(36).slice(2,10);const dot=p=>`<span class="dot" style="background:${esc(p.color)}"></span>`;
async function api(body){const r=await fetch(API,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json',Authorization:'Bearer '+token}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Connection failed.');return j;}
function adopt(j){s.people=j.people;s.me=s.people.findIndex(p=>p.id===memberId);for(const type of ['entries','ideas','events','pins'])s[type]=j.records.filter(r=>r.type===type).map(r=>({...JSON.parse(r.payload),id:r.id,person:s.people.findIndex(p=>p.id===r.owner),owner:r.owner}));s.voted=j.records.filter(r=>r.type==='votes'&&r.owner===memberId).map(r=>JSON.parse(r.payload).idea);s.ideas.forEach(i=>i.votes=j.records.filter(r=>r.type==='votes'&&JSON.parse(r.payload).idea===i.id).length);serverState=structuredClone(s);loaded=true;}
async function refresh(){if(syncing||form)return;try{const loadedBefore=loaded;const old=JSON.stringify([s.people,s.entries,s.ideas,s.events,s.pins,s.voted]);adopt(await api());if(!loadedBefore||old!==JSON.stringify([s.people,s.entries,s.ideas,s.events,s.pins,s.voted])||!content.innerHTML)render();}catch(e){if(!loaded){content.innerHTML='<p role="alert">Could not load the shared calendar.</p><button data-action="retry">Retry</button>';}else toast(e.message);}}
async function persist(){if(!serverState||s.me<0||syncing)return;const before=serverState,after=structuredClone(s);syncing=true;try{const me=after.people[after.me],prev=before.people.find(p=>p.id===memberId);if(prev&&(me.name!==prev.name||me.color!==prev.color))await api({action:'profile',name:me.name,color:me.color});for(const type of ['entries','ideas','events','pins']){const a=after[type],b=before[type];for(const r of a){if(r.person!==after.me)continue;if(!r.id)r.id=crypto.randomUUID();const old=b.find(x=>x.id===r.id);if(!old||JSON.stringify(old)!==JSON.stringify(r))await api({action:'save',type,id:r.id,payload:r});}for(const r of b)if(r.person===before.me&&!a.some(x=>x.id===r.id))await api({action:'delete',type,id:r.id});}for(const id of new Set([...before.voted,...after.voted]))if(before.voted.includes(id)!==after.voted.includes(id))await api({action:'vote',id,active:after.voted.includes(id)});adopt(await api());toast('Saved to the shared calendar.');}catch(e){try{adopt(await api());}catch{}toast(e.message+' Changes were not saved.');}finally{syncing=false;render();}}
async function loadWeather(){weatherError=false;try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.8136&longitude=144.9631&daily=weather_code,temperature_2m_max,precipitation_probability_max&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&timezone=Australia%2FMelbourne&forecast_days=16');if(!r.ok)throw Error();forecast=await r.json();}catch{weatherError=true;}if(loaded&&s.me>=0&&!form&&view==='calendar')render();}
function join(){content.innerHTML='<h2>Join hplc calendar</h2><form id="tg-join"><label for="tg-joinname">Your name</label><input id="tg-joinname" name="name" required maxlength="32" autocomplete="given-name" placeholder="Enter your name"><label for="tg-joincolor">Your colour</label><input id="tg-joincolor" name="color" type="color" value="#cc7190"><button class="primary full" type="submit">Join calendar</button></form><p class="sub" style="margin-top:14px">Everyone with this link shares one calendar. This browser remembers you.</p>';}
function toast(t){const el=root.querySelector('#tg-toast');el.textContent=t;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,5000);}
function overlaps(date){let windows=[];for(let h=0;h<24;h++){if(s.people.length>0&&s.people.every((_,p)=>s.entries.some(e=>e.date===date&&e.person===p&&e.start<=h&&e.end>=h+1))){const last=windows.at(-1);if(last&&last[1]===h)last[1]=h+1;else windows.push([h,h+1]);}}return windows;}
function changeDate(date){s.date=date;s.selectedTime=null;ideaIndex=0;render();}
function weather(date){if(!forecast)return null;const n=forecast.daily.time.indexOf(date);if(n<0)return null;let code=forecast.daily.weather_code[n],temp=forecast.daily.temperature_2m_max[n],rain=forecast.daily.precipitation_probability_max[n],wind=0;if(s.selectedTime&&date===s.date){const hours=forecast.hourly.time.map((t,i)=>({t,i})).filter(x=>x.t.startsWith(date)&&Number(x.t.slice(11,13))>=s.selectedTime[0]&&Number(x.t.slice(11,13))<s.selectedTime[1]).map(x=>x.i);if(hours.length){code=Math.max(...hours.map(i=>forecast.hourly.weather_code[i]));temp=Math.max(...hours.map(i=>forecast.hourly.temperature_2m[i]));rain=Math.max(...hours.map(i=>forecast.hourly.precipitation_probability[i]));wind=Math.max(...hours.map(i=>forecast.hourly.wind_speed_10m[i]));}}const wet=code>=51||rain>=50,unsafe=code>=95||wind>=35||temp>=35;return {icon:wet?'☂':code>1?'☁':'☀',label:code>=95?'Thunderstorms':wet?'Rainy':code>1?'Cloudy':'Sunny',temp:Math.round(temp),rain:Math.round(rain),kind:wet||unsafe?'Indoor':code<=1?'Outdoor':'Either'};}
function calendar(){const first=(new Date(s.year,s.month,1).getDay()+6)%7,days=new Date(s.year,s.month+1,0).getDate();let cells=Array(first).fill('<span class="empty-day" aria-hidden="true"></span>').join('');for(let d=1;d<=days;d++){const date=key(s.year,s.month,d),p=s.people.filter((_,i)=>s.entries.some(e=>e.date===date&&e.person===i)),shared=overlaps(date).length;cells+=`<button class="day ${date===s.date?'selected':''} ${shared?'shared':''}" data-date="${date}" aria-label="${dateLabel(date)}, ${p.length} friends added availability${shared?', everyone has overlapping free time':''}${s.events.some(e=>e.date===date)?', event scheduled':''}" aria-pressed="${date===s.date}">${d}${s.events.some(e=>e.date===date)?'<span class="event-dot" aria-label="Event">✦</span>':''}<span class="dots">${p.map(dot).join('')}</span></button>`;}cells+=Array((7-(first+days)%7)%7).fill('<span class="empty-day" aria-hidden="true"></span>').join('');const entries=s.entries.filter(e=>e.date===s.date).sort((a,b)=>a.person-b.person),windows=overlaps(s.date);const weatherDates=[-1,0,1].map(n=>{const d=new Date(s.date+'T12:00:00');d.setDate(d.getDate()+n);return key(d.getFullYear(),d.getMonth(),d.getDate());}).filter(d=>weather(d));const w=weather(s.date);const availableIdeas=s.ideas.filter(i=>!w||w.kind==='Either'||i.kind===w.kind||i.kind==='Either');const defaults=w?(w.kind==='Indoor'?[{id:'suggest-cafe',title:'Catch up at a café'},{id:'suggest-games',title:'Board games indoors'}]:[{id:'suggest-walk',title:'A walk and coffee'},{id:'suggest-picnic',title:'A picnic in the park'}]):[];const choices=availableIdeas.length?availableIdeas:defaults;const idea=choices[ideaIndex%Math.max(1,choices.length)];
content.innerHTML=`<button class="primary full" data-action="availability">+ Add my free time</button><div class="month"><button data-month="-1" aria-label="Previous month">‹</button><h3>${new Date(s.year,s.month,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'})}</h3><button data-month="1" aria-label="Next month">›</button></div><div class="calendar">${['M','T','W','T','F','S','S'].map(x=>`<span class="weekday">${x}</span>`).join('')}${cells}</div><div class="legend">${s.people.map(p=>`<span>${dot(p)}${esc(p.name)}</span>`).join('')}</div><p class="sub">Green = everyone free · ✦ event</p><section class="sheet" aria-label="Selected date"><h3>${dateLabel(s.date)}</h3>${s.events.filter(e=>e.date===s.date).map(e=>`<div class="day-event"><span>✦ ${esc(e.title)}</span><span class="sub">${eventTime(e)}${e.place?" · "+esc(e.place):""}</span></div>`).join('')}${entries.length?entries.map(e=>`<div class="person">${dot(s.people[e.person])}<span>${esc(s.people[e.person].name)}</span><span class="time">${range(e.start,e.end)}</span></div>`).join(''):'<p class="sub" style="margin-top:10px">No availability added.</p>'}<div class="overlap">${windows.length?windows.map(([a,b])=>`<button data-slot="${a},${b}" aria-pressed="${s.selectedTime?.[0]===a}">♡ Everyone free · ${range(a,b)}</button>`).join(''):'<p class="sub">No shared free time yet.</p>'}</div></section>${s.selectedTime?`<section class="note" id="tg-suggestion" aria-live="polite"><div class="eyebrow">Suggested activity</div><h3>${idea?esc(idea.title):'Add an idea for this weather'}</h3><p class="sub">${w?w.label+' · ':''}${range(...s.selectedTime)}${!w?' · Forecast not available':''}</p>${idea?`<div class="actions"><button class="primary" data-plan="${idea.id}">♡ Choose this</button><button data-action="another">Another idea</button></div>`:''}</section>`:`<p class="sub" style="margin-top:18px">Select a shared time for suggestions.</p>`}<section style="margin-top:24px"><h3>Weather <span aria-hidden="true">✣</span></h3><p class="sub">Melbourne · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p><div class="weather">${weatherDates.map(date=>{let f=weather(date);return `<button data-date="${date}" class="${date===s.date?'active':''}" aria-label="Forecast ${dateLabel(date)} ${f.label}"><span>${new Date(date+'T12:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric'})}</span><span class="symbol">${f.icon}</span><span>${f.label}</span><span class="temp">${f.temp}°C</span><span>${f.rain}% rain</span></button>`}).join('')}</div>${!w?`<p class="sub" style="margin-top:10px">${weatherError?'Weather is unavailable. Try again shortly.':forecast?'Forecast not available for this date yet.':'Loading live forecast…'}</p>`:''}</section>${s.plan?`<div class="saved">♡ Your draft plan<br><strong>${esc(s.plan.title)}</strong><br>${dateLabel(s.plan.date)} · ${range(...s.plan.time)}<br><span class="sub">A prototype choice—no invitations sent.</span></div>`:''}`;}
function availability(){const own=s.entries.filter(e=>e.person===s.me&&e.date===s.date);content.innerHTML=`<button class="link" data-action="back">‹ Back to calendar</button><h2>Add your free time</h2><form id="tg-availability"><input type="hidden" name="person" value="${s.me}"><label for="tg-date">Date</label><input id="tg-date" name="date" type="date" value="${s.date}" required><label class="check"><input type="checkbox" name="all" id="tg-all">I’m free all day</label><div class="fields" id="tg-timefields"><div><label for="tg-start">From</label><select id="tg-start" name="start">${hours(14,false)}</select></div><div><label for="tg-end">Until</label><select id="tg-end" name="end">${hours(18,true)}</select></div></div><p class="error" id="tg-error" role="alert"></p><button class="primary full" type="submit">Save my free time ♡</button></form><p class="sub" style="margin-top:12px">Add another range by saving again. Overlapping ranges are combined.</p>${own.length?`<section class="sheet"><h3>Your entries for this date</h3>${own.map(e=>`<div class="row"><span>${range(e.start,e.end)}</span><button class="link" data-delete-entry="${e.id}" aria-label="Remove ${range(e.start,e.end)}">Remove</button></div>`).join('')}</section>`:''}`;}
function hours(selected,end){let str='';for(let h=end?1:0;h<=(end?24:23);h++)str+=`<option value="${h}" ${h===selected?'selected':''}>${time(h)}</option>`;return str;}
function me(){content.innerHTML=`<h2>My profile</h2><section class="sheet"><form id="tg-profile-form"><label for="tg-name">Your name</label><input id="tg-name" name="name" value="${esc(s.people[s.me].name)}" maxlength="24" required><label for="tg-color">Your calendar colour</label><input id="tg-color" name="color" type="color" value="${esc(s.people[s.me].color)}"><div class="swatches">${['#cc7190','#e4a0ac','#b64965','#a34b46','#c06f49','#db9972','#d4a332','#ddc77d','#789561','#526f49','#83b39c','#3c827a','#6295b2','#88b5cf','#465f8b','#9b82b5','#bea5cc','#7b587c'].map(c=>`<button type="button" data-color="${c}" style="background:${c}" aria-label="Choose ${c}" aria-pressed="${s.people[s.me].color===c}"></button>`).join('')}</div><button class="primary full" type="submit">Save profile</button></form></section><button class="full" data-action="availability">+ Add my free time</button>`;}
function eventTime(e){return e.at?new Date('2000-01-01T'+e.at).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}):'Time TBC';}
function ideas(){content.innerHTML=`<div class="row"><h2>Ideas & events</h2><span class="sewn-heart" aria-hidden="true">♡</span></div><div class="add-actions"><button class="primary" data-action="add-idea">+ Idea</button><button data-action="add-event">+ Event</button></div>${s.events.length?`<h3 class="section-label">Events</h3>${[...s.events].sort((a,b)=>(a.date+(a.at||'')).localeCompare(b.date+(b.at||''))).map(e=>`<section class="sheet event-card"><div class="event-date"><span>${new Date(e.date+'T12:00:00').toLocaleDateString('en-AU',{month:'short'})}</span><strong>${Number(e.date.slice(-2))}</strong></div><div><h3>${esc(e.title)}</h3><p class="sub">${dateLabel(e.date)} · ${eventTime(e)}</p>${e.place?`<p class="sub">${esc(e.place)}</p>`:''}<p class="sub">${esc(s.people[e.person]?.name||'Group')}</p><div class="event-actions"><button class="link" data-eventdate="${e.date}">View date</button>${e.person===s.me?`<button class="link" data-editevent="${e.id}">Edit</button>`:''}</div></div></section>`).join('')}`:''}<h3 class="section-label">Activities</h3>${s.ideas.map(i=>`<section class="sheet idea-card"><span class="tag">${esc(i.kind)}</span><h3>${esc(i.title)}</h3><div class="row" style="margin-top:12px"><span class="sub">${esc(s.people[i.person]?.name||'Group')}</span><button data-vote="${i.id}" aria-pressed="${s.voted.includes(i.id)}">${s.voted.includes(i.id)?'♥':'♡'} ${i.votes}</button></div></section>`).join('')}`;}
function ideaForm(){const event=editingEvent?s.events.find(e=>e.id===editingEvent):null;const isEvent=form==='event';content.innerHTML=`<button class="link" data-tab="ideas">‹ Ideas & events</button><h2>${event?'Edit event':isEvent?'Add event':'Add idea'}</h2><form id="tg-idea-form"><input name="type" type="hidden" value="${isEvent?'event':'idea'}"><label for="tg-title">${isEvent?'Event':'Activity'}</label><input id="tg-title" name="title" required maxlength="70" value="${esc(event?.title||'')}" placeholder="${isEvent?'Exhibition, gig, market…':'Picnic, café, board games…'}">${isEvent?`<label for="tg-eventdate">Date</label><input id="tg-eventdate" name="date" type="date" required value="${event?.date||s.date}"><label for="tg-eventtime">Time (optional)</label><input id="tg-eventtime" name="at" type="time" value="${event?.at||''}"><label for="tg-eventplace">Place (optional)</label><input id="tg-eventplace" name="place" maxlength="100" value="${esc(event?.place||'')}" placeholder="Venue or suburb">`:`<label for="tg-kind">Setting</label><select id="tg-kind" name="kind"><option>Outdoor</option><option>Indoor</option><option>Either</option></select>`}<button class="primary full" type="submit">${isEvent?'Save event':'Save idea'}</button>${event&&event.person===s.me?'<button class="link full" type="button" data-action="remove-event">Remove event</button>':''}</form>`;}
function map(){content.innerHTML=`<h2>Melbourne</h2><p class="sub">Drag map · tap a heart</p><div class="maparea" id="tg-map" aria-label="Live interactive Melbourne map"></div><button class="primary full" data-action="addpin">${addingPin?'Cancel placing pin':'+ Add a pin'}</button>${addingPin?'<p class="sub">Tap the map to place your pin.</p>':''}<div id="tg-pin-detail"></div><div class="pinlist">${s.pins.map((p,i)=>`<button data-pin="${i}"><span style="color:${s.people[p.person]?.color||'#9c4531'}">♥</span><span>${esc(p.name)}<small>${esc(p.note||'')}</small></span></button>`).join('')}</div>`;drawMap();if(editPin!==null&&s.pins[editPin])pinDetail(editPin);}
function drawMap(){if(!window.L){root.querySelector('#tg-map').textContent='Map could not load. Please reload.';return;}liveMap=L.map(root.querySelector('#tg-map')).setView(mapCentre,mapLevel);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(liveMap);liveMap.on('moveend',()=>{mapCentre=[liveMap.getCenter().lat,liveMap.getCenter().lng];mapLevel=liveMap.getZoom();});s.pins.forEach((p,i)=>L.marker([p.lat,p.lng],{icon:L.divIcon({className:'heart-pin',html:`<span style="color:${esc(s.people[p.person]?.color||'#9c4531')}">♥</span>`,iconSize:[34,42],iconAnchor:[17,40]}),title:p.name}).addTo(liveMap).on('click',()=>{if(addingPin)return;editPin=i;pinDetail(i);}));liveMap.on('click',e=>{if(!addingPin)return;pendingLocation={lat:e.latlng.lat,lng:e.latlng.lng};editPin=null;form='pin';render();});}
function pinDetail(i){const p=s.pins[i];const box=root.querySelector('#tg-pin-detail');if(!box)return;box.innerHTML=`<section class="sheet"><div class="eyebrow">saved by ${esc(s.people[p.person]?.name)}</div><h3>${esc(p.name)}</h3><p style="margin-top:8px">${esc(p.note||'No note yet.')}</p>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">Open saved link ↗</a>`:''}<div class="row" style="margin-top:10px">${p.person===s.me?`<button data-editpin="${i}">Edit note & details</button>`:''}<a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener" class="sub">Google Maps ↗</a></div></section>`;}
function pinForm(){const p=editPin!==null?s.pins[editPin]:null;content.innerHTML=`<button class="link" data-tab="map">‹ Back to map</button><h2>${p?'Edit pin':'Add pin'}</h2><form id="tg-pin-form"><label for="tg-place">Place name</label><input id="tg-place" name="name" value="${esc(p?.name||'')}" placeholder="That café we keep talking about" maxlength="70" required><label for="tg-pinnote">Your note</label><textarea id="tg-pinnote" name="note" maxlength="300" rows="3" placeholder="Viral café from TikTok — the pastries look amazing!">${esc(p?.note||'')}</textarea><label for="tg-pinlink">Link (optional)</label><input id="tg-pinlink" type="url" name="link" value="${esc(p?.link||'')}" placeholder="https://…"><p class="error" id="tg-error" role="alert"></p><button class="primary full" type="submit">Save this place ♡</button>${p?'<button class="link full" type="button" data-action="deletepin">Remove this pin</button>':''}</form>`;}
function render(){if(liveMap){liveMap.remove();liveMap=null;}if(!loaded){content.innerHTML='<p>Loading shared calendar…</p>';return;}if(s.me<0){join();return;}root.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===view?'page':'false'));if(form==='availability')availability();else if(form==='idea'||form==='event')ideaForm();else if(form==='pin')pinForm();else ({calendar,map,ideas,me}[view]||calendar)();}
root.addEventListener('click',e=>{if(syncing){e.preventDefault();return;}const b=e.target.closest('button');if(!b)return;if(b.type==='submit'&&b.form){e.preventDefault();if(b.form.reportValidity())saveForm(b.form);return;}if(b.dataset.tab){view=b.dataset.tab;form=null;addingPin=false;render();root.scrollIntoView({block:'start'});return;}if(b.dataset.eventdate){view='calendar';form=null;s.year=Number(b.dataset.eventdate.slice(0,4));s.month=Number(b.dataset.eventdate.slice(5,7))-1;changeDate(b.dataset.eventdate);root.scrollIntoView({block:'start'});return;}if(b.dataset.editevent){editingEvent=b.dataset.editevent;form='event';render();return;}if(b.dataset.date){changeDate(b.dataset.date);return;}if(b.dataset.month){s.month+=Number(b.dataset.month);if(s.month<0){s.month=11;s.year--;}if(s.month>11){s.month=0;s.year++;}s.date=key(s.year,s.month,1);s.selectedTime=null;render();return;}if(b.dataset.slot){s.selectedTime=b.dataset.slot.split(',').map(Number);ideaIndex=0;render();root.querySelector('#tg-suggestion')?.scrollIntoView({block:'nearest'});return;}if(b.dataset.color){root.querySelector('#tg-color').value=b.dataset.color;root.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}if(b.dataset.deleteEntry){s.entries=s.entries.filter(x=>x.id!==b.dataset.deleteEntry);persist();render();return;}if(b.dataset.vote){const id=b.dataset.vote,i=s.ideas.find(x=>x.id===id),already=s.voted.includes(id);i.votes+=already?-1:1;s.voted=already?s.voted.filter(x=>x!==id):[...s.voted,id];persist();render();return;}if(b.dataset.plan){s.events.push({id:uid(),person:s.me,title:s.ideas.find(i=>i.id===b.dataset.plan)?.title||({'suggest-cafe':'Catch up at a café','suggest-games':'Board games indoors','suggest-walk':'A walk and coffee','suggest-picnic':'A picnic in the park'}[b.dataset.plan]),date:s.date,at:String(s.selectedTime[0]).padStart(2,'0')+':00',place:''});persist();render();toast('Saving…');return;}if(b.dataset.pin!==undefined){editPin=Number(b.dataset.pin);pinDetail(editPin);return;}if(b.dataset.editpin!==undefined){editPin=Number(b.dataset.editpin);form='pin';render();return;}if(b.dataset.zoom){const old=mapZoom;mapZoom=Math.min(5,Math.max(.7,mapZoom*Number(b.dataset.zoom)));mapPan=[mapWidth/2-(mapWidth/2-mapPan[0])*mapZoom/old,165-(165-mapPan[1])*mapZoom/old];drawMap();return;}const action=b.dataset.action;if(action==='retry'){refresh();return;}if(action==='availability'){form='availability';render();}else if(action==='back'){form=null;view='calendar';render();}else if(action==='another'){ideaIndex++;render();}else if(action==='add-idea'){editingEvent=null;form='idea';render();}else if(action==='add-event'){editingEvent=null;form='event';render();}else if(action==='remove-event'){s.events=s.events.filter(e=>e.id!==editingEvent);editingEvent=null;form=null;view='ideas';persist();render();toast('Saving…');}else if(action==='addpin'){addingPin=!addingPin;render();}else if(action==='pincentre'){const loc=projection.invert([(mapWidth/2-mapPan[0])/mapZoom,(165-mapPan[1])/mapZoom]);pendingLocation={lng:loc[0],lat:loc[1]};editPin=null;form='pin';render();}else if(action==='resetmap'){mapZoom=1;mapPan=[0,0];drawMap();}else if(action==='deletepin'){s.pins.splice(editPin,1);editPin=null;form=null;persist();render();toast('Saving…');}});
root.addEventListener('change',e=>{if(e.target.id==='tg-profile'){s.me=Number(e.target.value);persist();render();}if(e.target.id==='tg-all'){root.querySelector('#tg-timefields').hidden=e.target.checked;}});
async function saveForm(f){const data=new FormData(f);if(f.id==='tg-join'){const button=f.querySelector('button');button.disabled=true;try{const j=await api({action:'join',name:String(data.get('name')),color:String(data.get('color'))});memberId=j.member.id;localStorage.setItem('hplc-member',String(memberId));adopt(await api());render();}catch(e){toast(e.message);button.disabled=false;}return;}if(f.id==='tg-availability'){const person=Number(data.get('person')),date=String(data.get('date')),start=data.get('all')?0:Number(data.get('start')),end=data.get('all')?24:Number(data.get('end'));if(end<=start){root.querySelector('#tg-error').textContent='Choose a finish time after your start time.';return;}let a=start,b=end;const same=s.entries.filter(x=>x.person===person&&x.date===date);let changed=true,merged=new Set();while(changed){changed=false;for(const x of same)if(!merged.has(x.id)&&x.start<=b&&x.end>=a){a=Math.min(a,x.start);b=Math.max(b,x.end);merged.add(x.id);changed=true;}}s.entries=s.entries.filter(x=>!merged.has(x.id));s.entries.push({id:uid(),person,date,start:a,end:b});s.me=person;s.date=date;s.year=Number(date.slice(0,4));s.month=Number(date.slice(5,7))-1;s.selectedTime=null;form=null;view='calendar';persist();render();toast('Saving…');}else if(f.id==='tg-profile-form'){s.people[s.me].name=String(data.get('name')).trim()||s.people[s.me].name;s.people[s.me].color=String(data.get('color'));persist();render();toast('Saving…');}else if(f.id==='tg-idea-form'){const title=String(data.get('title')).trim();if(!title)return;if(data.get('type')==='event'){const old=s.events.find(e=>e.id===editingEvent);const event={id:editingEvent||uid(),title,date:String(data.get('date')),at:String(data.get('at')||''),place:String(data.get('place')||'').trim(),person:old?.person??s.me};if(editingEvent)s.events=s.events.map(e=>e.id===editingEvent?event:e);else s.events.push(event);editingEvent=null;}else{s.ideas.push({id:uid(),title,kind:String(data.get('kind')),person:s.me,votes:0});}form=null;view='ideas';persist();render();toast('Saving…');}else if(f.id==='tg-pin-form'){const link=String(data.get('link')).trim();if(link&&!/^https?:\/\//i.test(link)){root.querySelector('#tg-error').textContent='Use a link starting with https:// or http://.';return;}const p={...(editPin!==null?s.pins[editPin]:{...pendingLocation,person:s.me,id:crypto.randomUUID()}),name:String(data.get('name')).trim(),note:String(data.get('note')),link};if(editPin!==null)s.pins[editPin]=p;else{s.pins.push(p);editPin=s.pins.length-1;}addingPin=false;form=null;view='map';persist();render();toast('Saving…');}}
root.addEventListener('submit',e=>{e.preventDefault();saveForm(e.target);});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('form')){e.preventDefault();const f=e.target.closest('form');if(f.reportValidity())saveForm(f);}});
render();refresh();loadWeather();setInterval(()=>{if(!document.hidden)refresh();},8000);
})();
